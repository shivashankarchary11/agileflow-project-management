[project]
name = "agileflow"
version = "1.0.0"
description = "Small-team Agile project management: Project -> User Story -> Task"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask==3.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "SQLAlchemy==2.0.58",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]
prod = [
    "gunicorn==27.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "error::DeprecationWarning:agileflow",
    "error::ResourceWarning",
]

[tool.coverage.run]
source = ["agileflow"]
omit = ["agileflow/workers/worker.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) plus the syntax/runtime-class pycodestyle checks.
# Kept small on purpose; extend it (e.g. "I" for import sorting) once `ruff format` is adopted.
select = ["E4", "E7", "E9", "F"]
